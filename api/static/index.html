<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SANKALP — Clearing Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0c0f14; --bg-raised:#12161d; --bg-card:#161b23;
    --line:#262d38; --line-soft:#1c222b;
    --ink:#e7ebf1; --ink-dim:#97a2b3; --ink-faint:#5b6577;
    --brass:#d3a24e; --pass:#4fb8a0; --pass-dim:#2b4a44;
    --fail:#e2685a; --fail-dim:#4a2e2c; --ghost:#454e5c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 28px 80px;}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px;}
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand .mark{font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:var(--brass);}
  .brand .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
  .health{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);}

  nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;}
  nav button{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.01em;
    background:var(--bg-raised);color:var(--ink-dim);border:1px solid var(--line);
    padding:9px 14px;border-radius:100px;cursor:pointer;transition:.15s;
  }
  nav button:hover{border-color:var(--brass);color:var(--ink);}
  nav button.active{background:var(--brass);color:#0c0f14;border-color:var(--brass);font-weight:600;}

  #content{min-height:400px;}
  .placeholder{color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:60px 0;text-align:center;}
  .error{color:var(--fail);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:30px;border:1px solid var(--fail-dim);border-radius:10px;background:var(--fail-dim);}

  h1{font-family:'Fraunces',serif;font-weight:500;font-size:28px;margin:6px 0 8px;text-wrap:balance;}
  .lede{color:var(--ink-dim);font-size:14.5px;line-height:1.55;max-width:70ch;margin:0 0 24px;}
  .lede.quote{font-style:italic;}

  .scripted-banner{
    display:flex;gap:10px;align-items:flex-start;background:var(--bg-raised);
    border:1px solid var(--brass);border-left-width:3px;border-radius:0 10px 10px 0;
    padding:14px 18px;margin-bottom:24px;font-size:13px;color:var(--ink-dim);line-height:1.5;
  }
  .scripted-banner b{color:var(--brass);font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;}

  .obligation{display:flex;gap:0;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;margin-bottom:24px;overflow:hidden;flex-wrap:wrap;}
  .field{flex:1 1 160px;padding:14px 18px;border-right:1px solid var(--line-soft);}
  .field:last-child{border-right:none;}
  .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px;}
  .v{font-size:13.5px;}
  .v.mono{font-family:'IBM Plex Mono',monospace;}
  .v.floor{color:var(--brass);font-weight:600;font-family:'IBM Plex Mono',monospace;}

  .section-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--line);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
  @media (max-width:800px){.grid2{grid-template-columns:1fr;}}

  .card{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .cart-items{display:flex;flex-direction:column;gap:8px;font-size:13px;}
  .cart-item{display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line-soft);}
  .cart-item:last-child{border:none;padding:0;}
  .cart-total{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-weight:600;}

  .vcard{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;position:relative;transition:opacity .2s;}
  .vcard.excluded{opacity:.4;}
  .row1{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .role{font-family:'Fraunces',serif;font-size:15.5px;font-weight:500;text-transform:capitalize;}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:100px;}
  .chip.pass{background:var(--pass-dim);color:var(--pass);}
  .chip.fail{background:var(--fail-dim);color:var(--fail);}
  .chip.abstain{background:var(--line-soft);color:var(--ink-dim);}
  .stamp{position:absolute;top:12px;right:14px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--fail);border:1px solid var(--fail-dim);padding:2px 6px;border-radius:100px;background:var(--fail-dim);}
  .basis-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-dim);margin-bottom:8px;}
  .basis-badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;border:1px solid var(--line);}
  .basis-badge.SELF{color:var(--fail);border-color:var(--fail-dim);background:var(--fail-dim);}
  .basis-badge.REC{color:var(--pass);border-color:var(--pass-dim);background:var(--pass-dim);}
  .basis-badge.SIGN,.basis-badge.WIT,.basis-badge.ATT{color:var(--ink-dim);}
  .conf{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);margin-bottom:8px;}
  .reasoning{font-size:12px;color:var(--ink-faint);font-style:italic;padding-top:8px;border-top:1px solid var(--line-soft);}

  .decision{margin-top:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-radius:14px;padding:22px 26px;}
  .decision.EXECUTE{background:linear-gradient(135deg,var(--pass-dim),var(--bg-card) 65%);border:1px solid var(--pass-dim);}
  .decision.ABORT,.decision.HOLD{background:linear-gradient(135deg,var(--fail-dim),var(--bg-card) 65%);border:1px solid var(--fail-dim);}
  .decision.CLARIFY{background:linear-gradient(135deg,#3d3320,var(--bg-card) 65%);border:1px solid #5a4a26;}
  .decision .action{font-family:'Fraunces',serif;font-weight:600;font-size:28px;}
  .decision.EXECUTE .action{color:var(--pass);}
  .decision.ABORT .action,.decision.HOLD .action{color:var(--fail);}
  .decision.CLARIFY .action{color:var(--brass);}
  .decision .meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-dim);line-height:1.6;}

  .counterfactual{margin-top:14px;padding:16px 20px;background:var(--bg-raised);border:1px dashed var(--line);border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);}
  .counterfactual b{color:var(--brass);}

  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="mark">SANKALP</span>
      <span class="sub">Clearing Console — Live</span>
    </div>
    <span class="health" id="health">connecting…</span>
  </header>

  <nav id="nav"></nav>

  <div id="content"><div class="placeholder">Select a scenario above.</div></div>

  <footer>Real constraint verifier, receipt verifier, aggregator, and engine on every scenario. Two scenarios use a labelled scripted semantic response instead of a live call — see the banner on those pages.</footer>
</div>

<script>
const API = "";
let SCENARIOS = [];

async function boot(){
  try{
    const h = await fetch(API + "/health").then(r => r.json());
    document.getElementById("health").textContent = `corpus: ${h.corpus_records} records · ok`;
  }catch(e){
    document.getElementById("health").textContent = "backend unreachable";
  }
  try{
    SCENARIOS = await fetch(API + "/api/scenarios").then(r => r.json());
  }catch(e){
    document.getElementById("content").innerHTML = `<div class="error">Could not load scenarios: ${e}</div>`;
    return;
  }
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  SCENARIOS.forEach(s => {
    const btn = document.createElement("button");
    btn.textContent = s.label;
    btn.dataset.id = s.id;
    btn.onclick = () => selectScenario(s.id, btn);
    nav.appendChild(btn);
  });
  if (SCENARIOS.length) selectScenario(SCENARIOS[0].id, nav.firstChild);
}

async function selectScenario(id, btn){
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  const content = document.getElementById("content");
  content.innerHTML = '<div class="placeholder">Running the real pipeline…</div>';
  try{
    const data = await fetch(`${API}/api/clear/${id}`).then(r => {
      if (!r.ok) return r.json().then(e => { throw new Error(e.detail || r.statusText); });
      return r.json();
    });
    render(data);
  }catch(e){
    content.innerHTML = `<div class="error">Scenario failed: ${e.message}</div>`;
  }
}

function esc(s){ return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function verifierCard(v){
  const cls = v.verdict.toLowerCase();
  const excluded = !v.survived;
  return `
    <div class="vcard ${excluded ? 'excluded' : ''}">
      ${excluded ? '<span class="stamp">excluded pre-join</span>' : ''}
      <div class="row1">
        <span class="role">${esc(v.role)} verifier</span>
        <span class="chip ${cls}">${esc(v.verdict)}</span>
      </div>
      <div class="conf">confidence: ${v.confidence.toFixed(2)}${v.loss_estimate ? ' · loss estimate: ₹' + esc(v.loss_estimate) : ''}</div>
      <div class="basis-row">declared basis <span class="basis-badge ${esc(v.basis_class)}">${esc(v.basis_class)}</span>
        ${excluded ? '· below floor, weight = 0' : '· meets floor'}</div>
      ${v.reasoning ? `<div class="reasoning">${esc(v.reasoning)}</div>` : ''}
    </div>`;
}

function decisionBanner(d, label){
  return `
    <div class="decision ${esc(d.action)}">
      <span class="action">${esc(d.action)}</span>
      <div class="meta">
        ${label ? `<div style="color:var(--ink-faint);margin-bottom:4px;">${esc(label)}</div>` : ''}
        reason_code: ${esc(d.reason_code)}<br>
        basis_class: ${esc(d.basis_class ?? '—')} · confidence: ${d.confidence.toFixed(2)}<br>
        settlement: ${esc(d.settlement_hash.slice(0,12))}…
      </div>
    </div>`;
}

function render(data){
  const ob = data.obligation, cart = data.cart;
  let html = "";

  if (data.semantic_response_is_scripted){
    html += `<div class="scripted-banner"><div><b>Scripted semantic response</b>${esc(data.scripted_note)}</div></div>`;
  }

  html += `<h1>${esc(data.scenario.label || data.scenario.violation_class)}</h1>`;
  html += `<p class="lede quote">"${esc(data.scenario.instruction_text)}"</p>`;

  html += `<div class="obligation">
    <div class="field" style="flex:2;"><div class="k">Criteria</div><div class="v mono">${
      ob.acceptance_criteria.length
        ? ob.acceptance_criteria.map(c => `${esc(c.field)} ${esc(c.operator)} ${esc(c.value)} <span style="color:var(--ink-faint)">(${esc(c.source)})</span>`).join('<br>')
        : '<span style="color:var(--ink-faint)">none</span>'
    }</div></div>
    <div class="field"><div class="k">Budget ceiling</div><div class="v">${ob.budget_ceiling ? '₹' + esc(ob.budget_ceiling) : '—'}</div></div>
    <div class="field"><div class="k">Merchant scope</div><div class="v">${esc((ob.merchant_scope.merchant_ids || []).join(', ') || ob.merchant_scope.category || '—')}</div></div>
    <div class="field floor"><div class="k">Admissibility floor</div><div class="v">${esc(ob.admissibility_floor)}</div></div>
  </div>`;

  html += `<div class="grid2">
    <div class="card">
      <div class="section-label">Cart</div>
      <div class="cart-items">${cart.items.map(i => `<div class="cart-item"><span>${esc(i.quantity)}× ${esc(i.name)}</span><span class="mono">₹${esc(i.unit_price)}</span></div>`).join('')}</div>
      <div class="cart-total"><span>${esc(cart.merchant.name)}</span><span>₹${esc(cart.total)}</span></div>
    </div>
    <div class="card">
      <div class="section-label">Self-report</div>
      ${data.self_report
        ? `<div style="font-style:italic;font-size:13px;color:var(--ink-dim);">"${esc(data.self_report.claim)}"</div><div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint);margin-top:8px;text-transform:uppercase;">via ${esc(data.self_report.emitter)} — SELF class</div>`
        : `<div style="color:var(--ink-faint);font-size:13px;">none supplied for this order</div>`}
    </div>
  </div>`;

  html += `<div class="section-label">Verifier mesh</div>`;
  html += data.verifiers.map(verifierCard).join("");

  html += decisionBanner(data.decision, data.counterfactual ? "With floor enforcement" : null);

  if (data.counterfactual){
    html += `<div class="counterfactual"><b>Counterfactual — floor disabled:</b> action = ${esc(data.counterfactual.action)}, reason_code = ${esc(data.counterfactual.reason_code)}. This is what would have happened had the excluded verifier's verdict been allowed to vote.</div>`;
  }

  document.getElementById("content").innerHTML = html;
}

boot();
</script>
</body>
</html>
