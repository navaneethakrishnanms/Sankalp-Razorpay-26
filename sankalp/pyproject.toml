[project]
name = "sankalp"
version = "0.1.0"
description = "Intent-Fulfilment Clearing for Agentic UPI Commerce"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Razorpay SDK — test mode only. Never call provider SDKs from business logic;
    # always go through core/settlement/rails/razorpay.py.
    "razorpay>=1.4",
    # LLM — accessed only through core/llm/client.py, never directly.
    "openai>=1.30",
    "anthropic>=0.28",
    "diskcache>=5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agent", "api", "eval", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# --cov flags are NOT in default addopts: pytest-cov may not be installed.
# Run coverage explicitly:  pytest --cov=core --cov-report=term-missing
# or via:                   make test-cov
addopts = ["--tb=short", "-v"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
