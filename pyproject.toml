[project]
name = "sankalp"
version = "0.1.0"
description = "Intent-Fulfilment Clearing for Agentic UPI Commerce"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Razorpay SDK — test mode only. Never call provider SDKs from business logic;
    # always go through core/settlement/rails/razorpay.py.
    "razorpay>=1.4",
    # LLM — accessed only through core/llm/client.py, never directly.
    # Both providers are installed so the Groq/Anthropic swap is reversible
    # without a dependency change; which one runs is config, not code
    # (SANKALP_LLM_PROVIDER).
    # The response cache is a plain content-addressed directory of JSON files
    # (core/llm/client.LLMClient), not diskcache: the cache must be COMMITTED
    # and human-readable so a reviewer can see which prompt produced which
    # response, which a binary cache format would prevent.
    "groq>=0.11",
    "anthropic>=0.28",
    # Loads .env at client construction. Keys never live in code or in git.
    "python-dotenv>=1.0",
    # MCP server (mcp_server/) — the one integration surface: clear_intent().
    # Pinned below 2.0: mcp 2.x renamed FastMCP -> MCPServer with a different
    # import path and API shape. mcp_server/server.py is written against the
    # stable 1.x FastMCP surface; bumping past 2.0 needs a deliberate,
    # tested migration, not an unpinned floor quietly picking it up.
    "mcp>=1.2.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
sankalp-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only packages that actually exist — listing a missing one fails the build.
packages = ["core", "agent", "eval", "api", "mcp_server"]

[tool.hatch.build.targets.wheel.force-include]
# Prompt templates are data, not code, and must ship with the package —
# core/llm/prompts/__init__.py loads them from disk at runtime.
"core/llm/prompts" = "core/llm/prompts"
# The demo frontend is a static asset read from disk by api/main.py::index(),
# not importable Python — it needs the same force-include treatment.
"api/static" = "api/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# --cov flags are NOT in default addopts: pytest-cov may not be installed.
# Run coverage explicitly:  pytest --cov=core --cov-report=term-missing
# or via:                   make test-cov
addopts = ["--tb=short", "-v"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
